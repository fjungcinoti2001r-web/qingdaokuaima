#member-error:empty,#notice:empty{display:none}#member-error{color:#873d28;margin:0}
.account-note{font-size:13px;color:var(--muted)}
#notice{position:fixed;bottom:8%;left:50%;transform:translateX(-50%);background:#403221;color:white;padding:6px 14px;border-radius:4px;z-index:10;font-size:13px;pointer-events:none}
.top .wrap{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;padding-block:6px}
.community-label{border-left:1px solid #d6c8ac;padding-left:8px;font:500 12px/1.45 var(--display);color:#675437;text-wrap:balance}
.top nav{min-width:0}.top #account{max-width:85px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.community-notice{text-align:left;border-block:1px solid var(--line);margin:0 6px 14px;padding:14px 0 12px;color:#615749}
.community-notice h2{font:700 16px/1.4 var(--display);margin:0 0 6px}
.community-notice p{margin:0;font-size:13px;line-height:1.85;letter-spacing:.015em}
@media(max-width:370px){.top .wrap{gap:6px}.top .brand{width:70px}.top #account{padding-inline:7px}.community-label{padding-left:6px}}.roll-face{grid-template-columns:23% minmax(0,1fr);grid-template-rows:auto auto;align-content:center;align-items:center;column-gap:3%;padding-inline:5% 12%}
.cover-logo{grid-column:1;grid-row:1/3;width:100%;height:auto;mix-blend-mode:multiply}
.roll-title{grid-column:2;grid-row:1;white-space:nowrap;font-size:clamp(16px,4.9vw,31px);letter-spacing:.04em}
.roll-credit{grid-column:2;grid-row:2;display:grid;justify-items:center;gap:1px;line-height:1.45;margin-top:2px}
.roll-credit span:last-child{font-size:clamp(9px,2vw,11px);color:#796b54;font-weight:400;letter-spacing:.025em}.cover-logo{width:100%;height:clamp(67px,18vw,104px);object-fit:contain;mix-blend-mode:normal}
.roll-credit{font-family:"Songti SC","Noto Serif CJK SC","Noto Serif SC","SimSun",serif;line-height:1.35;margin-top:4px;gap:3px}
.roll-credit span:first-child{font-size:clamp(12px,3vw,15px);font-weight:500;color:#594831;letter-spacing:.12em}
.roll-credit span:last-child{font-family:inherit;font-size:clamp(10px,2.1vw,11px);letter-spacing:.055em;color:#77694f}.roll-face{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 10%;gap:1px}
.roll-title{font-size:clamp(20px,5.5vw,33px);letter-spacing:.065em}
.roll-credit{margin-top:3px}
.hero .wrap{position:relative;isolation:isolate;background:none;border:0;padding:10px clamp(14px,4vw,27px) 12px}
.hero .wrap::before{content:"";position:absolute;z-index:-1;inset:0 0 0 28%;pointer-events:none;background:var(--painting) right 55% / cover no-repeat;mix-blend-mode:multiply;opacity:.85;mask-image:linear-gradient(to right,transparent,#000 25%),linear-gradient(to bottom,transparent,#000 23%,#000 69%,transparent);mask-composite:intersect}
.hero h1{font:700 clamp(29px,6.5vw,36px)/1.18 var(--display);letter-spacing:.09em;margin:0 0 9px}
.hero h1 span{font:500 12px/1.3 var(--display);letter-spacing:.18em;margin-bottom:3px}
.hero .meter{max-width:215px;gap:4px 10px}
.hero .meter strong{font-size:12px;font-weight:500}.hero progress{height:3px}
#share{padding:2px 8px;font-size:12px}
#films{padding-top:12px}
.catalog-heading{display:flex;align-items:center;justify-content:space-between;gap:8px}
.catalog-heading h2{margin:0;font:700 23px/1.4 var(--display);border-left:3px solid var(--gold);padding-left:8px}
#cloud-status{font-size:13px;color:#79582c}#film-form{display:grid;gap:9px}#film-form label{display:grid;gap:3px}#film-form input{font:inherit;border:1px solid #c7b794;padding:7px;min-width:0}
.remove-note{color:#804837}.no-poster{display:grid;place-items:center;aspect-ratio:2/3;font-size:12px;color:var(--muted)}

const $=id=>document.getElementById(id);
function read(key,fallback){try{return JSON.parse(localStorage.getItem('cavelries-preview:'+key))??fallback}catch{return fallback}}
function write(key,value){try{localStorage.setItem('cavelries-preview:'+key,JSON.stringify(value))}catch{}}

const {url:projectUrl,publishableKey}=window.QD_SUPABASE;
const cacheKey='qd-cloud:'+new URL(projectUrl).hostname+':';
const originalFilms=new Map(films.map(f=>[f.id,f]));
let active=null,seen=new Set(),ratings={},notes={},drafts={},totals={},ready=false;
const loginKey=cacheKey+'device-login';
function deviceLogin(){
 try{return JSON.parse(localStorage.getItem(loginKey))}catch{return null}
}
function restoreLogin(){
 const remembered=deviceLogin();
 if(remembered)return remembered.signedIn?remembered.session:null;
 try{
  const old=JSON.parse(sessionStorage.getItem(cacheKey+'session'));
  if(old){localStorage.setItem(loginKey,JSON.stringify({signedIn:true,session:old}));sessionStorage.removeItem(cacheKey+'session')}
  return old;
 }catch{return null}
}
let session=restoreLogin(),refreshing,revision=0;
function setSession(value){
 if(value)localStorage.setItem(loginKey,JSON.stringify({signedIn:true,session:value}));
 else localStorage.removeItem(loginKey);
 sessionStorage.removeItem(cacheKey+'session');
 session=value;
}
window.addEventListener('storage',event=>{
 if(event.key!==loginKey&&event.key!==null)return;
 const oldId=session?.user?.id;
 session=restoreLogin();
 if(oldId!==session?.user?.id){active=null;shareName='';syncCloud().catch(syncError)}
});
function scoped(key){return cacheKey+(active?.id||'guest')+':'+key}
async function api(path,{method='GET',body,headers={},token}={}){
 const h={apikey:publishableKey,...headers};
 if(token)h.Authorization='Bearer '+token;
 if(body!==undefined)h['Content-Type']='application/json';
 const res=await fetch(projectUrl+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
 const raw=await res.text();
 let data;try{data=raw?JSON.parse(raw):null}catch{data=null}
 if(!res.ok){const err=Error(data?.msg||data?.message||data?.error_description||'请求失败，请重试');err.status=res.status;err.code=data?.code;throw err}
 return data;
}
async function access(){
 if(!session)return undefined;
 if(session.expires_at>Date.now()/1000+45)return session.access_token;
 if(!refreshing){
  const refresh=async()=>{
   const saved=deviceLogin();
   if(!saved?.signedIn){session=null;return}
   const previous=session=saved.session;
   if(previous.expires_at>Date.now()/1000+45)return;
   try{
    const next=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:previous.refresh_token}});
    const current=deviceLogin();
    if(current?.session.refresh_token!==previous.refresh_token)return;
    if(current.signedIn)setSession(next);
    else localStorage.setItem(loginKey,JSON.stringify({signedIn:false,session:next}));
   }catch(err){
    if([400,401].includes(err.status)&&deviceLogin()?.session.refresh_token===previous.refresh_token){
     setSession(null);active=null;shareName='';$('account').textContent='注册 / 登录';$('add-film').hidden=true;
    }
    throw err;
   }
  };
  refreshing=(navigator.locks?navigator.locks.request(loginKey,refresh):refresh()).finally(()=>{refreshing=null});
 }
 await refreshing;return session?.access_token;
}
async function db(path,options={}){
 return api('/rest/v1/'+path,{...options,token:await access()});
}
async function rows(table,order){
 const data=[];let offset=0;
 for(;;){
  const page=await db(table+'?select=*&order='+order+'&limit=500&offset='+offset);
  data.push(...page);if(page.length<500)return data;
  offset+=page.length;
 }
}
function indexFilm(f){return searchText([f.name,f.director,f.cast,f.release,f.genre,f.group,f.note].join(' '))}
async function syncCloud(){
 const request=++revision;
 const [catalog,members,marks,reviews,likes]=await Promise.all([
  rows('qd_films','id'),rows('qd_members','id'),rows('qd_marks','film,member'),
  rows('qd_reviews','created_at,id'),rows('qd_likes','review,member')
 ]);
 if(request!==revision)return;
 const profiles=new Map(members.map(m=>[m.id,m]));
 active=profiles.get(session?.user?.id)||null;
 drafts=read(scoped('drafts'),{});
 films.splice(0,films.length,...catalog.map(row=>{
  const original=originalFilms.get(row.id);
  return {...original,...row,year:Number(row.release.slice(0,4)),cast:row.actors,group:original?.group||row.genre,note:original?.note||'',poster:row.poster||original?.poster||''};
 }));
 filmKeywords.clear();films.forEach(f=>filmKeywords.set(f.id,indexFilm(f)));
 const years=films.map(f=>f.year);if(years.length){
  const lo=Math.min(...years),hi=Math.max(...years);
  $('order').options[0].textContent='按发行时间正序（'+lo+'→'+hi+'）';
  $('order').options[1].textContent='按发行时间倒序（'+hi+'→'+lo+'）';
 }
 totals=Object.fromEntries(films.map(f=>[f.id,{sum:0,votes:0,seen:0}]));
 seen=new Set();ratings={};notes={};
 for(const m of marks){
  const t=totals[m.film];if(!t)continue;t.seen++;
  if(m.score){t.sum+=m.score;t.votes++}
  if(m.member===active?.id){seen.add(m.film);if(m.score)ratings[m.film]=m.score}
 }
 const hearts=new Map();
 for(const like of likes){if(!hearts.has(like.review))hearts.set(like.review,[]);hearts.get(like.review).push(like.member)}
 for(const r of reviews){
  (notes[r.film]??=[]).push({id:r.id,member:r.member,author:profiles.get(r.member)?.name||'影友',score:r.score,text:r.body,parent:r.parent,likes:hearts.get(r.id)||[]});
 }
 $('account').textContent=active?.name||'注册 / 登录';
 $('add-film').hidden=!active?.is_admin;
 $('progress').max=Math.max(1,films.length);
 if(active)shareName=active.name;
 ready=true;$('cloud-status').hidden=true;draw();
}
function syncError(err){
 const status=$('cloud-status');status.hidden=false;
 status.querySelector('span').textContent=err.code==='PGRST205'||err.code==='42P01'?'云端片库尚未初始化。':'云端暂时无法读取，请检查网络后重试。';
}
function average(id){const t=totals[id];return t?.votes?t.sum/t.votes:0}
function stats(id){const t=totals[id];return t?.votes?'★ '+average(id).toFixed(1)+'（'+t.votes+'人评）':'暂无评分'}

function searchText(value){
 return value.normalize('NFKC').toLowerCase().replace(/[\s·：《》:／/]/g,'');
}
const filmKeywords=new Map(films.map(f=>[f.id,searchText([f.name,f.director,f.cast,f.release,f.genre,f.group,f.note].join(' '))]));
function compareFilms(a,b){
 const mode=$('order').value;
 const chronological=a.release.localeCompare(b.release);
 if(mode==='desc')return -chronological;
 if(mode==='score')return average(b.id)-average(a.id)||chronological;
 if(mode==='seen')return (totals[b.id]?.seen||0)-(totals[a.id]?.seen||0)||chronological;
 return chronological;
}
const escapeHTML=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const progressText=()=> '已看 '+seen.size+' / '+films.length+' 部';
const seenButton=f=>'<button data-seen="'+f.id+'" aria-pressed="'+seen.has(f.id)+'" class="seen plain small">'+(seen.has(f.id)?'✓ 已看':'＋ 看过')+'</button>';
function ratingBlock(f){
 const score=ratings[f.id]||0;
 const summary=stats(f.id);
 const stars=Array.from({length:5},(_,i)=>{
  const n=i+1;
  return '<button type="button" data-rate="'+f.id+'" data-value="'+n+'" aria-label="'+(n===score?'取消 '+n+' 星评分':'打 '+n+' 星')+'" aria-pressed="'+(n===score)+'" title="'+(n===score?'再次点击取消':'打 '+n+' 星')+'">'+(n<=score?'★':'☆')+'</button>';
 }).join('');
 return '<div class="rating"><div class="stars" role="group" aria-label="'+escapeHTML(f.name)+'的个人评分">'+stars+'</div><span class="rating-summary" aria-label="均分及评分人数">'+summary+'</span></div>';
}
function inlineDiscussion(f){
 const list=notes[f.id]||[],draft=drafts[f.id]||{},parent=list.find(n=>n.id===draft.parent);
 const comments=list.map(n=>{
  const reply=list.find(item=>item.id===n.parent);
  return '<article class="comment" id="comment-'+n.id+'"><strong>'+escapeHTML(n.author||'本地影友')+'</strong><span class="review-stars">'+(n.score?'★'.repeat(n.score):'')+'</span>'+(reply?'<button class="quote" data-jump="'+reply.id+'">回复 · '+escapeHTML(reply.text)+'</button>':'')+
  '<p>'+escapeHTML(n.text)+'</p><div class="row"><button class="plain small" data-inline-like="'+f.id+'" data-target="'+n.id+'" aria-pressed="'+Boolean(active&&n.likes?.includes(active.id))+'">'+('♡ '+(n.likes?.length||0))+
  '</button><button class="plain small" data-reply="'+n.id+'" data-film="'+f.id+'">回复</button>'+(active?.is_admin?'<button class="plain small remove-note" data-remove="'+n.id+'" data-film="'+f.id+'">删除</button>':'')+'</div></article>';
 }).join('');
 const editor=active&&ratings[f.id]?'<form class="editor" data-film="'+f.id+'">'+(parent?'<div class="row">回复 '+escapeHTML(parent.author||'本地影友')+'<button type="button" class="plain small" data-cancel data-film="'+f.id+'">取消回复</button></div>':'')+
 '<div class="compose"><textarea rows="1" maxlength="400" required aria-label="'+escapeHTML(f.name)+'的短评" placeholder="写句短评，与大家分享">'+escapeHTML(draft.text||'')+'</textarea><button class="gold small">发布</button></div></form>':'';
 return '<div class="inline-discussion">'+editor+comments+'</div>';
}

function watchLink(f){
 if(!f.url||!/^https:\/\//i.test(f.url))return '';
 const provider=f.url.includes('iqiyi.com/')?'爱奇艺':f.url.includes('v.qq.com/')?'腾讯视频':'平台';
 return '<a class="plain small watch" href="'+escapeHTML(f.url)+'" target="_blank" rel="noopener">去'+provider+'观看</a>';
}
let catalogueVisible=false;
function draw(){
 if(!catalogueVisible)return;
 $('progress-label').textContent=progressText();
 $('progress').value=seen.size;
 const words=$('keyword').value.trim().split(/\s+/).map(searchText).filter(Boolean);
 const list=films.filter(f=>(!$('unseen').checked||!seen.has(f.id))&&words.every(word=>filmKeywords.get(f.id).includes(word))).sort(compareFilms);
 $('empty').textContent=words.length?'没有找到符合条件的影片。试试其他关键词。':'这些影片都已打卡。';
 $('empty').hidden=Boolean(list.length);
 const entries=list.map(f=>[f.id,'<article class="film" data-film-id="'+f.id+'"><div class="art">'+(f.poster?'<img loading="lazy" decoding="async" src="'+escapeHTML(f.poster)+'" alt="'+escapeHTML(f.name)+'海报">':'<span class="no-poster">暂无海报</span>')+'</div><div class="details"><h2 class="name">《'+escapeHTML(f.name)+'》</h2><div class="meta">年份：'+f.year+'</div><dl class="film-info"><div><dt>导演</dt><dd>'+escapeHTML(f.director)+'</dd></div><div><dt>主演</dt><dd>'+escapeHTML(f.cast)+'</dd></div><div><dt>类型</dt><dd>'+escapeHTML(f.genre)+'</dd></div></dl><div class="row">'+watchLink(f)+'</div></div><div class="checkin-panel"><div class="checkin-row">'+seenButton(f)+ratingBlock(f)+'</div>'+inlineDiscussion(f)+'</div></article>']);
 reconcileFilms(entries);
}
const filmNodes=new Map();
function reconcileFilms(entries){
 const grid=$('grid'),keep=new Set(entries.map(([id])=>id));
 for(const [id,{node}] of filmNodes){
  if(!keep.has(id)){node.remove();filmNodes.delete(id)}
 }
 let cursor=grid.firstElementChild;
 for(const [id,markup] of entries){
  let row=filmNodes.get(id);
  if(!row||row.markup!==markup){
   const tpl=document.createElement('template');tpl.innerHTML=markup;
   const node=tpl.content.firstElementChild;
   if(row){if(cursor===row.node)cursor=node;row.node.replaceWith(node)}
   row={node,markup};filmNodes.set(id,row);
  }
  if(row.node!==cursor)grid.insertBefore(row.node,cursor);
  cursor=row.node.nextElementSibling;
 }
}
function saveDraft(id,patch){drafts[id]={...drafts[id],...patch};write(scoped('drafts'),drafts)}
const composer=id=>$('grid').querySelector('form[data-film="'+id+'"] textarea');
function announce(message){
 const bar=$('notice');bar.textContent=message;clearTimeout(announce.timer);
 announce.timer=setTimeout(()=>bar.textContent='',3200);
}
function openUtility(markup){
 $('utility-body').innerHTML=markup;
 if(!$('utility').open)$('utility').showModal();
}
function errorMessage(error){
 if(error.code==='23505')return '已有相同记录，请刷新查看。';
 if(error.code==='42501')return '当前账号没有此操作权限。';
 if(/already registered|already exists/i.test(error.message))return '这个 ID 已注册，请直接登录。';
 if(/invalid login/i.test(error.message))return '账号或密码不正确。';
 if(/email not confirmed/i.test(error.message))return '请先到注册邮箱完成验证。';
 return error.message;
}
async function requireReady(){
 if(!ready){try{await syncCloud()}catch(err){syncError(err);throw Error('请先连接并初始化云端片库。')}}
}
async function loginAddress(id){
 if(id==='林科森')return 'qd-admin@members.invalid';
 const digest=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(id)));
 const tag=Array.from(digest.slice(0,24),byte=>byte.toString(16).padStart(2,'0')).join('');
 return 'qd-'+tag+'@members.invalid';
}
function showAccount(after,register=false){
 if(active){
  openUtility('<h2 id="utility-title">'+escapeHTML(active.name)+'</h2><p>'+(active.is_admin?'社区管理员':'社区影友')+'</p><button id="logout" class="outline">退出登录</button>');
  if(active.name==='林科森'&&!active.is_admin&&/^[0-9a-f-]{36}$/i.test(active.id)){
   const grant="update public.qd_members set is_admin = true where id = '"+active.id+"' and name = '林科森' returning name, is_admin;";
   const panel=document.createElement('details');
   panel.innerHTML='<summary>管理员授权 SQL</summary><p>在 Supabase SQL Editor 运行以下语句，完成后刷新网页。</p><textarea rows="4" readonly aria-label="本账号的授权 SQL"></textarea><button type="button" class="outline small">复制 SQL</button>';
   const box=panel.querySelector('textarea');box.value=grant;box.style.width='100%';
   panel.querySelector('button').onclick=async()=>{try{await navigator.clipboard.writeText(grant);announce('已复制授权 SQL')}catch{box.select()}};
   $('logout').before(panel);
  }
  $('logout').onclick=async()=>{
   const remembered=deviceLogin();
   if(remembered)localStorage.setItem(loginKey,JSON.stringify({...remembered,signedIn:false}));
   session=null;active=null;shareName='';seen=new Set();ratings={};drafts={};
   $('account').textContent='注册 / 登录';$('add-film').hidden=true;$('utility').close();draw();
   await syncCloud().catch(syncError);
  };return;
 }
 const remembered=deviceLogin();
 if(!register&&remembered?.session){
  setSession(remembered.session);
  syncCloud().then(()=>{
   if(active){after?.();return}
   setSession(null);showAccount(after);
  }).catch(err=>{
   if(!session)showAccount(after);
   else{syncError(err);announce('连接失败，请稍后重试')}
  });
  return;
 }

 const label=register?'注册':'登录';
 openUtility('<h2 id="utility-title">'+label+'</h2><form id="member-form"><label>ID<input name="identity" type="text" required '+(register?'maxlength="18"':'maxlength="254"')+' autocomplete="username" autocapitalize="none" spellcheck="false"></label>'+
 '<label>密码<input name="password" type="password" minlength="6" required autocomplete="'+(register?'new-password':'current-password')+'"></label>'+
 '<p id="member-error" role="status"></p><div class="row"><button class="gold">'+label+'</button><button class="plain" type="button" id="change-mode">'+(register?'已有账号，去登录':'注册新账号')+'</button></div></form>');
 $('change-mode').onclick=()=>showAccount(after,!register);
 $('member-form').onsubmit=async e=>{
  e.preventDefault();const form=e.target,button=form.querySelector('.gold');button.disabled=true;
  const fields=new FormData(form),identity=fields.get('identity').trim();

  try{
   await requireReady();
   const id=identity.normalize('NFKC').trim();
   if(!id||register&&(Array.from(id).length>18||id.includes('@')))throw Error('ID 请填写 1 至 18 个字，不能包含 @。');
   const email=!register&&id.includes('@')?id:await loginAddress(id);
   const body={email,password:fields.get('password')};
   if(register){
    const settings=await api('/auth/v1/settings');
    if(!settings.mailer_autoconfirm)throw Error('ID 注册暂未开放，请管理员先在 Supabase 关闭 Confirm email。');
    body.data={qd_name:id};
   }
   const result=await api(register?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{method:'POST',body});
   if(!result.access_token){form.querySelector('[role=status]').textContent='注册未完成，请联系管理员检查登录设置。';return}

async function preparePoster(file){
 const image=new Image(),source=URL.createObjectURL(file);
 try{
  image.src=source;
  try{await image.decode()}catch{throw Error('无法读取这张图片，请换一张 JPG、PNG 或 WebP 海报。')}
  const ratio=Math.min(1,1200/Math.max(image.naturalWidth,image.naturalHeight));
  const canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(image.naturalWidth*ratio));
  canvas.height=Math.max(1,Math.round(image.naturalHeight*ratio));
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.84));
  if(!blob||blob.size>2097152)throw Error('图片处理失败，请换一张较小的海报。');
  return blob;
 }finally{URL.revokeObjectURL(source)}
}
async function uploadPoster(blob){
 const key='qd-film-posters/'+crypto.randomUUID()+'.jpg';
 const token=await access();
 if(!token)throw Error('请重新登录管理员账号。');
 const res=await fetch(projectUrl+'/storage/v1/object/'+key,{method:'POST',headers:{apikey:publishableKey,Authorization:'Bearer '+token,'Content-Type':'image/jpeg'},body:blob});
 if(!res.ok){
  const detail=await res.json().catch(()=>({}));
  if(/bucket not found|row.level security/i.test(detail.message||''))throw Error('海报存储尚未就绪，请管理员运行「02-开启海报上传.sql」。');
  throw Error('海报上传未成功，请重试。');
 }
 return projectUrl+'/storage/v1/object/public/'+key;
}

function makeSharePoster(horse){

  short:[...(notes[f.id]||[])].reverse().find(n=>!n.parent&&n.text.trim()&&n.member===active?.id)?.text||''
 })).filter(r=>r.score||r.short);
 const featured=reviews.slice().sort((a,b)=>b.score-a.score).slice(0,3);
 const canvas=document.createElement('canvas');
 const w=320,h=242+Math.max(1,featured.length)*45;
 canvas.width=w*3;canvas.height=h*3;
 const ctx=canvas.getContext('2d');
 ctx.scale(3,3);
 ctx.fillStyle='#fffcf5';ctx.fillRect(0,0,w,h);
 ctx.strokeStyle='#b69559';ctx.strokeRect(9,9,w-18,h-18);
 if(horse.naturalWidth){
  const iw=35,ih=iw*horse.naturalHeight/horse.naturalWidth;
  ctx.drawImage(horse,(w-iw)/2,22,iw,ih);
 }
 function text(value,x,y,size,color='#101010',align='left',bold=false,maxWidth){
  ctx.textAlign=align;
  ctx.font=(bold?'700 ':'')+size+'px FilmUI,"PingFang SC",sans-serif';
  ctx.fillStyle=color;
  if(maxWidth)ctx.fillText(value,x,y,maxWidth);else ctx.fillText(value,x,y);
 }
 text('轻刀快马影片打卡',160,99,22,'#101010','center',true);
 ctx.fillStyle='#f3ebdb';ctx.fillRect(22,117,276,58);
 const pct=Math.round(seen.size/films.length*100);
 text('影迷  '+shareName,32,138,13,'#101010','left',true,255);
 text('全通进度  '+seen.size+' / '+films.length+' 部（'+pct+'%）'+(pct===100?' · 本期全通':''),32,162,13,'#101010','left',true,255);
 text('我的高分代表作 / 短评',24,201,13,'#101010','left',true);
 if(!featured.length)text('还没有评分或短评。',24,227,12,'#101010');
 featured.forEach(({f,score,short},i)=>{
  const y=223+i*45;
  text('《'+escapeHTML(f.name)+'》 '+(score?'★'.repeat(score):'已看'),24,y,12,'#101010','left',true,272);
  if(short){
   const chars=Array.from(short.replace(/\s+/g,' '));
   text('“'+chars.slice(0,32).join('')+(chars.length>32?'…':'')+'”',24,y+17,11,'#101010','left',false,272);
  }
 });
 text('轻刀快马超话 · 制作：林科森',160,h-19,10,'#101010','center');
 return canvas;
}

<script>
(()=>{
 const root=document.documentElement;
 const entry=document.querySelector('.scroll-entry');
 const trigger=entry.querySelector('button');
 const sheet=document.querySelector('.hanging');
 const reduce=matchMedia('(prefers-reduced-motion: reduce)');
 let opening=false;
 trigger.addEventListener('click', async ()=>{
  if(opening)return;
  opening=true;catalogueVisible=true;draw();
  let rod;
  const active=[];
  function move(node,frames,duration,easing){
   const animation=node.animate(frames,{duration,easing,fill:'forwards'});
   active.push(animation);
   return animation.finished;
  }
  try{
   if(reduce.matches || !trigger.animate)return;
   const roll=trigger.getBoundingClientRect(),paper=sheet.getBoundingClientRect();
   const endY=paper.top+6-(roll.top+roll.height/2);
   await Promise.all([
    move(entry.querySelector('.roll-cord'),[{transform:'rotate(0)',opacity:1},{transform:'translate(10px,7px) rotate(-20deg)',opacity:0}],120,'ease-out'),
    move(entry.querySelector('.roll-hint'),[{opacity:1},{opacity:0}],150,'ease-out')
   ]);
   await move(trigger,[{transform:'none'},{transform:'translateY('+endY+'px) scale('+((paper.width+24)/roll.width)+',.13)'}],245,'cubic-bezier(.4,0,.2,1)');
   rod=document.createElement('div');rod.className='falling-rod';
   Object.assign(rod.style,{left:(paper.left-12)+'px',top:(paper.top-3)+'px',width:(paper.width+24)+'px'});
   document.body.appendChild(rod);
   entry.hidden=true;
   sheet.style.visibility='visible';
   const fall='cubic-bezier(.34,.02,.42,1)';
   await Promise.all([
    move(sheet,[{clipPath:'inset(-5px -16px 100% -16px)'},{clipPath:'inset(-5px -16px -5px -16px)'}],460,fall),
    move(rod,[{transform:'translateY(0)'},{transform:'translateY('+(paper.height-7)+'px)'}],460,fall)
   ]);
  }finally{
   entry.hidden=true;
   delete root.dataset.scroll;
   sheet.style.removeProperty('visibility');
   sheet.inert=false;
   rod?.remove();
   active.forEach(animation=>animation.cancel());
   document.querySelector('.paper-window').setAttribute('tabindex','-1');
   document.querySelector('.paper-window').focus({preventScroll:true});
  }
 });
})();
</script></html>
